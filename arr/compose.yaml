name: arr
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # UID/GID 0 du conteneur = compte deploy sur l'hôte rootless.
      PUID: "0"
      PGID: "0"
      TZ: ${TZ:-Europe/Brussels}
    volumes:
      - type: volume
        source: prowlarr-config
        target: /config
        read_only: false
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-net}
      traefik.http.routers.prowlarr.rule: "Host(`${PROWLARR_HOST:?Définir PROWLARR_HOST dans .env ou Komodo}`)"
      traefik.http.routers.prowlarr.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.prowlarr.tls: "true"
      traefik.http.routers.prowlarr.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-pki}
      traefik.http.routers.prowlarr.service: "prowlarr"
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik-net}
    external: true

volumes:
  prowlarr-config:
    external: true
    name: ${PROWLARR_CONFIG_VOLUME:?Nom exact du volume de production existant requis}
