name: arr
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    container_name: prowlarr
    restart: unless-stopped
    environment:
      # UID/GID 0 du conteneur = compte deploy sur l'hôte rootless.
      PUID: "0"
      PGID: "0"
      TZ: ${TZ:-Europe/Brussels}
    volumes:
      - prowlarr-config:/config
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.prowlarr.rule: "Host(`${PROWLARR_HOST:?Définir PROWLARR_HOST dans .env ou Komodo}`)"
      traefik.http.routers.prowlarr.entrypoints: "websecure"
      traefik.http.routers.prowlarr.tls: "true"
      traefik.http.routers.prowlarr.tls.certresolver: "letsencrypt"
      traefik.http.routers.prowlarr.service: "prowlarr"
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"

networks:
  traefik:
    name: traefik
    external: true

volumes:
  prowlarr-config:
